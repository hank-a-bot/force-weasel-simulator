<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Notre Dame Metallic Gold Dome Gradient -->
    <radialGradient id="ndGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF3A1" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="75%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8A6605" />
    </radialGradient>
    
    <!-- Metallic Facemask Gradient -->
    <linearGradient id="greyMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Helmet Outer Shadow -->
  <ellipse cx="34" cy="54" rx="20" ry="4" fill="rgba(0,0,0,0.25)" />

  <!-- Notre Dame Metallic Gold Dome Shell -->
  <path d="M 10 34 C 10 16, 22 8, 42 8 C 54 8, 58 18, 58 28 C 58 36, 52 44, 42 46 L 34 46 L 34 38 C 34 32, 28 30, 24 30 L 18 30 C 13 30, 10 33, 10 34 Z" fill="url(#ndGold)" stroke="#3D2B00" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Dome Surface Gloss Highlight -->
  <path d="M 18 14 C 28 10, 42 11, 48 16 C 38 14, 26 16, 18 22 Z" fill="#FFFFFF" opacity="0.65" />

  <!-- Ear Hole -->
  <circle cx="26" cy="34" r="5" fill="#0C2340" />
  <circle cx="26" cy="34" r="3" fill="#E2E8F0" />

  <!-- Notre Dame Grey Metal Face Mask Grill -->
  <!-- Main Outer Ring -->
  <path d="M 44 26 L 57 26 C 59 26, 60 38, 52 45 L 36 45" fill="none" stroke="url(#greyMask)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Horizontal Grill Bars -->
  <line x1="44" y1="32" x2="57" y2="32" stroke="url(#greyMask)" stroke-width="3" stroke-linecap="round" />
  <line x1="44" y1="38" x2="55" y2="38" stroke="url(#greyMask)" stroke-width="3" stroke-linecap="round" />
  <!-- Vertical Support Bar -->
  <line x1="51" y1="26" x2="51" y2="44" stroke="url(#greyMask)" stroke-width="3" stroke-linecap="round" />

  <!-- White Chin Strap Loop -->
  <path d="M 22 38 C 22 47, 30 49, 36 45" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <path d="M 22 38 C 22 47, 30 49, 36 45" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" />
</svg>